# Local, production-shaped stack: MongoDB + API + nginx-served client.
#
#   cp .env.example .env        # then set a long random JWT_SECRET
#   docker compose up --build
#   open http://localhost:8080
#
# The client and API share one origin through nginx (/api is proxied), so no
# CORS configuration or cross-site cookies are needed. This is intentionally a
# single-host setup: for real deployments use deploy/k8s with managed TLS.
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["--quiet"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./server
    restart: unless-stopped
    init: true
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGODB_URI: mongodb://mongo:27017/wecare
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to a random value of at least 32 characters}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      # Compose serves plain HTTP locally, so the session cookie cannot be
      # marked Secure here. Kubernetes behind TLS leaves this unset.
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./client
      # Same-origin default: the bundle calls /api, which nginx proxies.
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  uploads:
