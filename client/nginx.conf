# weCare web client.
#
# The API is proxied under /api on the same origin as the app, so the browser
# never issues a cross-site request and the HttpOnly session cookie stays
# first-party. `api` is the Docker Compose service name and the Kubernetes
# Service name, so the same image works in both environments.
#
# nginx does not inherit `add_header` into a location that declares its own, so
# the security headers are repeated wherever caching headers are added.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Memory photos are limited to 5 MB by the API; leave a little headroom.
    client_max_body_size 6m;

    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Uploads and downloads stream straight through instead of being
        # buffered to disk in a container with a read-only root filesystem.
        proxy_buffering off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Vite fingerprints these filenames, so they are safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;

        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Client-side routing: every unknown path renders the React app instead of
    # a 404, and the app decides what to show.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
