# Copy, fill in real values, and apply — do NOT commit the filled-in version.
#
#   kubectl apply -f deploy/k8s/secret.yaml
#
# Or create it without ever writing the values to disk:
#
#   kubectl -n wecare create secret generic wecare-secrets \
#     --from-literal=JWT_SECRET="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")" \
#     --from-literal=MONGODB_URI="mongodb://mongo:27017/wecare"
apiVersion: v1
kind: Secret
metadata:
  name: wecare-secrets
  labels:
    app.kubernetes.io/part-of: wecare
type: Opaque
stringData:
  JWT_SECRET: replace-with-a-random-secret-at-least-32-characters
  # In-cluster MongoDB created by mongo.yaml. For a managed database use its
  # TLS connection string instead, and remove the mongo resources.
  MONGODB_URI: mongodb://mongo:27017/wecare
